dragon-ball-test:
    extends: .game-test
    variables:
        SOURCE_PATHS: ./assets/games/dragon-ball,./assets/games/_slotgame_base
        TEST_PATHS: ./__tests__/games/_slotgame_base
        PROJECT_NAME: dragon_ball_client
    rules:
        - if: $CI_MERGE_REQUEST_IID
          changes:
              - assets/games/_slotgame_base/**/*
              - assets/games/dragon-ball/**/*
              - __tests__/games/_slotgame_base/**/*
        - when: never
