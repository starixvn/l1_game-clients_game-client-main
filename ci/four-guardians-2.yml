four-guardians-2-test:
    extends: .game-test
    variables:
        SOURCE_PATHS: ./assets/games/fourguardians2,./assets/games/_slotgame_base
        TEST_PATHS: ./__tests__/games/_slotgame_base
        PROJECT_NAME: four_guardians_2_client
    rules:
        - if: $CI_MERGE_REQUEST_IID
          changes:
              - assets/games/_slotgame_base/**/*
              - assets/games/fourguardians2/**/*
              - __tests__/games/_slotgame_base/**/*
        - when: never
