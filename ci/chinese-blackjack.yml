    variables:
        SOURCE_PATHS: ./assets/games/chinese-blackjack
        TEST_PATHS: ./__tests__/games/chinese-blackjack
        PROJECT_NAME: chinese-blackjack_client
    rules:
        - if: $CI_MERGE_REQUEST_IID
          changes:
              - assets/games/chinese-blackjack/**/*
              - __tests__/games/chinese-blackjack/**/*
