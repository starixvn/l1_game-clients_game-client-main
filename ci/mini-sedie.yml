mini-sedie-test:
    extends: .game-test
    variables:
        SOURCE_PATHS: ./assets/games/muliplay-mini-sedie,./assets/games/multiplay
        TEST_PATHS: ./__tests__/games/muliplay-mini-sedie,./__tests__/games/multiplay
        PROJECT_NAME: muliplay-mini-sedie
    rules:
        - if: $CI_MERGE_REQUEST_IID
          changes:
              - assets/games/multiplay/**/*
              - assets/games/muliplay-mini-sedie/**/*
              - __tests__/games/multiplay/**/*
              - __tests__/games/muliplay-mini-sedie/**/*
        - when: never
