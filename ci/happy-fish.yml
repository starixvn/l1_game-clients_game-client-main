happy-fish-test:
    extends: .game-test
    variables:
        SOURCE_PATHS: ./assets/games/happy-fish,./assets/games/_slotgame_base
        TEST_PATHS: ./__tests__/games/_slotgame_base
        PROJECT_NAME: happy_fish_client
    rules:
        - if: $CI_MERGE_REQUEST_IID
          changes:
              - assets/games/_slotgame_base/**/*
              - assets/games/happy-fish/**/*
              - __tests__/games/_slotgame_base/**/*
        - when: never
