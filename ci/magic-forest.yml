magic-forest-test:
    extends: .game-test
    variables:
        SOURCE_PATHS: ./assets/games/magic-forest,./assets/games/_slotgame_base
        TEST_PATHS: ./__tests__/games/_slotgame_base
        PROJECT_NAME: magic_forest_client
    rules:
        - if: $CI_MERGE_REQUEST_IID
          changes:
              - assets/games/_slotgame_base/**/*
              - assets/games/magic-forest/**/*
              - __tests__/games/_slotgame_base/**/*
        - when: never
