way-to-goal-test:
    extends: .game-test
    variables:
        SOURCE_PATHS: ./assets/games/way-to-goal,./assets/games/_slotgame_base
        TEST_PATHS: ./__tests__/games/_slotgame_base
        PROJECT_NAME: way_to_goal_client
    rules:
        - if: $CI_MERGE_REQUEST_IID
          changes:
              - assets/games/_slotgame_base/**/*
              - assets/games/way-to-goal/**/*
              - __tests__/games/_slotgame_base/**/*
        - when: never
