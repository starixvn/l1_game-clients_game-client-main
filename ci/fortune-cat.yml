fortune-cat-test:
    extends: .game-test
    variables:
        SOURCE_PATHS: ./assets/games/fortune-cat,./assets/games/_slotgame_base
        TEST_PATHS: ./__tests__/games/_slotgame_base
        PROJECT_NAME: fortune_cat_client
    rules:
        - if: $CI_MERGE_REQUEST_IID
          changes:
              - assets/games/_slotgame_base/**/*
              - assets/games/fortune-cat/**/*
              - __tests__/games/_slotgame_base/**/*
        - when: never
