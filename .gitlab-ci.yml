.game-test:
    stage: test
    trigger:
        include:
            - local: ci/cocos-testing-ci.yaml
    allow_failure: true

include:
    - project: "ci/core-cicd"
      ref: main
      file: "luminet.gitlab-ci.yml"

    - local: "ci/*.yml"

variables:
    COCOS_VERSION: 2.4.6

build_cocos_env:
    stage: build-cocos-web
    tags:
      - cocos-test

bundle-verification:
    stage: build
    image: hub.lumigame.com/docker-hub/library/node:18.14-alpine
    tags:
        - docker
    before_script:
        - npm set registry http://npm.lumigame.com
        - yarn global add fs-extra
        - yarn install
    script:
        - node ./test_bundle/bundle_verification.js
    rules:
        - if: $CI_COMMIT_TAG =~ /^deploy- */ && $DEPLOY_BY == "rocketor"
          when: always
        - when: never
    allow_failure: false
unit_test_js:
    before_script:
    - echo "run before test"        
    script:
    - echo "run test"        
sonar_js:
    needs:
    dependencies:
.sonar_js:
  extends: .sonar_common
  needs: ["unit_test_js"]
  dependencies:
    - unit_test_js
  image:
    name: $SONAR_SCANNER_CLI_IMAGE
  before_script:
    - !reference [.sonar_common, before_script]
    - echo $SRC_PATH
    - echo $TEST_PATH
  script:
    - sonar-scanner
      -X
      -Dsonar.host.url=$SONAR_HOST_URL
      -Dsonar.token=$SONAR_TOKEN
      -Dsonar.sourceEncoding=UTF-8
      -Dsonar.qualitygate.wait=true
      -Dsonar.projectKey=$PROJECT_NAME
      -Dsonar.projectName="$SONAR_PROJECT_NAME"
      -Dsonar.projectVersion="${CI_COMMIT_REF_NAME} ($CI_COMMIT_SHORT_SHA) [${CI_JOB_ID}]"
      -Dproject.settings=./sonarqube.analysis.properties
      -Dsonar.javascript.lcov.reportPaths=**/lcov.info
      -Dsonar.sources=${SRC_PATH}
      -Dsonar.tests=${TEST_PATH}
      -Dsonar.test.inclusions=**/__tests__/**,**/*.test.ts,**/*.spec.tsx,**/*.spec.ts
      -Dsonar.log.level=INFO | grep -E "ERROR|WARN|coverage"
