transformers-test:
    extends: .game-test
    variables:
        SOURCE_PATHS: ./assets/games/blackpink,./assets/games/_slotgame_base
        TEST_PATHS: ./__tests__/games/_slotgame_base
        PROJECT_NAME: transformers_client
    rules:
        - if: $CI_MERGE_REQUEST_IID
          changes:
              - assets/games/_slotgame_base/**/*
              - assets/games/transformers/**/*
              - __tests__/games/_slotgame_base/**/*
        - when: never
