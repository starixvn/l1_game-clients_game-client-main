fruit-slot-test:
    extends: .game-test
    variables:
        SOURCE_PATHS: ./assets/games/fruit-slot
        TEST_PATHS: ./__tests__/games/fruit-slot
        PROJECT_NAME: fruit_slot_client
    rules:
        - if: $CI_MERGE_REQUEST_IID
          changes:
              - assets/games/fruit-slot/**/*
              - __tests__/games/fruit-slot/**/*
        - when: never
