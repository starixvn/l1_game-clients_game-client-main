pontoon-test:
    extends: .game-test
    variables:
        SOURCE_PATHS: ./assets/games/pontoon
        TEST_PATHS: ./__tests__/games/pontoon
        PROJECT_NAME: pontoon_client
    rules:
        - if: $CI_MERGE_REQUEST_IID
          changes:
              - assets/games/pontoon/**/*
              - __tests__/games/pontoon/**/*
        - when: never
