win-three-cards-test:
    extends: .game-test
    variables:
        SOURCE_PATHS: ./assets/games/win-three-cards
        TEST_PATHS: ./__tests__/games/win-three-cards
        PROJECT_NAME: win_three_cards_client
    rules:
        - if: $CI_MERGE_REQUEST_IID
          changes:
              - assets/games/win-three-cards/**/*
              - __tests__/games/win-three-cards/**/*
        - when: never
