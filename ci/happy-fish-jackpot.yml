happy-fish-jackpot-test:
    extends: .game-test
    variables:
        SOURCE_PATHS: ./assets/games/happy-fish-jackpot,./assets/games/_slotgame_base
        TEST_PATHS: ./__tests__/games/_slotgame_base
        PROJECT_NAME: happy_fish_jackpot_client
    rules:
        - if: $CI_MERGE_REQUEST_IID
          changes:
              - assets/games/_slotgame_base/**/*
              - assets/games/happy-fish-jackpot/**/*
              - __tests__/games/_slotgame_base/**/*
        - when: never
